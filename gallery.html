<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | MotoFixPoint — Workshop Transformations</title>
    <meta name="description" content="Witness the transformation. Our gallery showcases real bike and car repair projects from Electronic City Bengaluru." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .gallery-page-container {
            padding-top: 150px;
            padding-bottom: 100px;
        }
        
        .gallery-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--mid);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
            box-shadow: 0 0 20px rgba(250, 5, 5, 0.3);
        }

        .vehicle-section {
            margin-bottom: 80px;
            animation: fadeIn 0.8s ease;
        }

        .vehicle-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-left: 4px solid var(--red);
            padding-left: 20px;
        }

        .vehicle-info h3 {
            font-size: 1.8rem;
            color: var(--white);
            margin: 0;
        }

        .vehicle-info .tag {
            background: rgba(250, 5, 5, 0.1);
            color: var(--red);
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .gallery-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/10;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: var(--red);
            z-index: 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.9), transparent);
            display: flex;
            align-items: flex-end;
            padding: 15px;
            opacity: 0;
            transition: 0.4s;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" aria-label="MotoFixPoint Home">
                <img src="assets/logo.png" alt="MotoFixPoint Logo" class="logo-img" />
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html" class="nav-active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="tel:+919999999999" class="nav-cta">📞 Call Now</a>
        </div>
    </nav>

    <main class="container gallery-page-container">
        <div class="section-header" style="text-align: center; margin-bottom: 60px;">
            <span class="section-tag">Transformation Gallery</span>
            <h2 class="section-title">Workshop <span class="accent">Masterpieces</span></h2>
            <p class="section-sub">Witness the journey from repair to perfection. This gallery updates automatically from our latest workshop records.</p>
        </div>

        <div id="galleryContainer">
            <!-- Dynamic projects will be injected here -->
            <div id="galleryLoading" style="text-align: center; padding: 50px; color: var(--mid);">
                <p>Loading the latest transformations...</p>
            </div>
        </div>
    </main>

    <footer style="margin-top: 50px; padding: 40px 0; background: var(--black); text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
        <p>&copy; <span id="year"></span> MotoFixPoint. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxSVACJI48Iec-Bnx4bvscsjkKLHoHTPfKsBuotvpg8I0jPWBTDuVKLQxpjHHXcOSy1cdpBCyp9ary/pub?output=csv';

        async function fetchGallery() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Skip header

                const container = document.getElementById('galleryContainer');
                const loading = document.getElementById('galleryLoading');
                
                let html = '';

                rows.forEach(row => {
                    // Simple CSV parser (handles commas within quotes if needed, but basic for now)
                    const columns = row.split(',');
                    if (columns.length < 4) return;

                    const vehicleName = columns[1];
                    const priority = columns[2];
                    const rawImages = columns[3]; // This could be filenames OR URLs

                    // Find Google Drive IDs if URLs are present
                    const driveIds = [];
                    const driveIdRegex = /\/d\/([a-zA-Z0-9_-]+)/g;
                    let match;
                    while ((match = driveIdRegex.exec(rawImages)) !== null) {
                        driveIds.push(match[1]);
                    }

                    if (vehicleName && driveIds.length > 0) {
                        html += `
                            <div class="vehicle-section">
                                <div class="vehicle-info">
                                    <h3>${vehicleName}</h3>
                                    <span class="tag">Transformation Record</span>
                                </div>
                                <div class="gallery-grid-full">
                                    ${driveIds.map(id => `
                                        <div class="gallery-item">
                                            <img src="https://lh3.googleusercontent.com/d/${id}" alt="${vehicleName}" onerror="this.src='https://via.placeholder.com/600x400/1a1a1a/fafafa/?text=Image+Loading...'">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                });

                if (html) {
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--mid);">No transformation records found yet. Upload via the form to see results!</div>';
                }

            } catch (error) {
                console.error('Gallery Fetch Error:', error);
                document.getElementById('galleryContainer').innerHTML = '<p style="text-align:center; color:var(--red);">Error loading gallery. Please try again later.</p>';
            }
        }

        fetchGallery();
    </script>
</body>
</html>
</body>
</html>
