<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | MotoFixPoint — Workshop Transformations</title>
    <meta name="description" content="Witness the transformation. Our gallery showcases real bike and car repair projects from Electronic City Bengaluru." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --glass-glow: rgba(250, 5, 5, 0.15);
        }

        .gallery-page-container {
            padding-top: 180px;
            padding-bottom: 150px;
        }

        /* Skeleton Loader - More Natural */
        .skeleton {
            width: 100%;
            height: 400px;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            overflow: hidden;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        
        /* Grid of Project Cards - High End Spacing */
        #galleryContainer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            animation: fadeInUp 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .project-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .project-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, var(--glass-glow), transparent 70%);
            opacity: 0;
            transition: 0.6s;
        }

        .project-card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: rgba(250, 5, 5, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            background: rgba(255, 255, 255, 0.08);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-card-image {
            width: 100%;
            aspect-ratio: 16/11;
            overflow: hidden;
            background: #0d0d0d;
            position: relative;
        }

        .project-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .project-card:hover .project-card-image img {
            transform: scale(1.1) rotate(1deg);
            filter: brightness(1.2) contrast(1.1);
        }

        .project-card-info {
            padding: 40px 30px;
            text-align: left;
            position: relative;
            z-index: 2;
        }

        .project-card-info h3 {
            font-size: 1.8rem;
            margin: 0;
            color: var(--white);
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .project-card-count {
            display: inline-block;
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--red);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 6px 16px;
            background: rgba(250, 5, 5, 0.1);
            border: 1px solid rgba(250, 5, 5, 0.2);
            border-radius: 50px;
        }

        /* Lightbox - Ultra Premium Blur */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: zoomIn 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        .lightbox-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lightbox-close {
            position: fixed;
            top: 50px;
            left: 50px;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.22rem;
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.4s;
            z-index: 10001;
        }

        .lightbox-close:hover {
            background: var(--red);
            border-color: var(--red);
            transform: rotate(180deg) scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--white);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2.5rem;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10002;
        }

        .lightbox-nav:hover {
            background: var(--red);
            border-color: var(--red);
            box-shadow: 0 0 30px rgba(250, 5, 5, 0.5);
            transform: translateY(-50%) scale(1.15);
        }

        .lightbox-prev { left: -120px; }
        .lightbox-next { right: -120px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1400px) {
            .lightbox-prev { left: 30px; }
            .lightbox-next { right: 30px; }
            .lightbox-close { top: 30px; left: 30px; }
            .lightbox-nav { width: 60px; height: 60px; font-size: 1.8rem; }
            #galleryContainer { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 900px) {
            #galleryContainer { grid-template-columns: 1fr; gap: 30px; }
            .section-title { font-size: 3rem !important; }
        }
    </style>
</head>

<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" aria-label="MotoFixPoint Home">
                <img src="assets/logo.png" alt="MotoFixPoint Logo" class="logo-img" />
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html" class="nav-active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="tel:+919999999999" class="nav-cta">📞 Call Now</a>
        </div>
    </nav>

    <main class="container gallery-page-container">
        <div class="section-header" style="text-align: center; margin-bottom: 80px;">
            <span class="section-tag" style="background: rgba(250,5,5,0.1); color:var(--red); padding: 5px 15px; border-radius: 50px; font-weight: 800; letter-spacing: 2px;">TRANSFORMATION GALLERY</span>
            <h1 class="section-title" style="font-size: 4rem; margin-top: 20px;">WORKSHOP <span class="accent">MASTERPIECES</span></h1>
            <p class="section-sub" style="max-width: 600px; margin: 20px auto;">Witness the journey from repair to perfection. Click any project to view the high-resolution transformation results.</p>
        </div>

        <div id="galleryContainer">
            <!-- Skeletons load immediately -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </main>

    <!-- Lightbox Structure -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightboxImg" src="" alt="Gallery Image">
            </div>
            <button class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">&#10094;</button>
            <button class="lightbox-nav lightbox-next" onclick="changeImage(1)">&#10095;</button>
            <div id="lightboxCaption" style="margin-top: 30px; color: var(--white); font-weight: 800; font-size: 1.8rem; font-family: 'Bebas Neue'; letter-spacing: 2px;"></div>
        </div>
    </div>

    <footer style="margin-top: 100px; padding: 60px 0; background: #080808; text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
        <p>&copy; <span id="year"></span> MotoFixPoint. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxSVACJI48Iec-Bnx4bvscsjkKLHoHTPfKsBuotvpg8I0jPWBTDuVKLQxpjHHXcOSy1cdpBCyp9ary/pub?output=csv';

        let currentProjectImages = [];
        let currentIndex = 0;

        // Robust CSV Parser
        function parseCSVLine(line) {
            let cols = [];
            let cur = '';
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    cols.push(cur.trim());
                    cur = '';
                } else {
                    cur += char;
                }
            }
            cols.push(cur.trim());
            return cols;
        }

        async function fetchGallery() {
            const container = document.getElementById('galleryContainer');
            
            // 1. Instant Load from Cache (if exists) 
            const cachedData = localStorage.getItem('motofix_gallery_cache');
            if (cachedData) {
                renderHTML(JSON.parse(cachedData));
            }

            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                const lines = data.split('\n').filter(l => l.trim().length > 0);
                const projects = [];

                // Parse records
                for (let i = 1; i < lines.length; i++) {
                    const columns = parseCSVLine(lines[i]);
                    if (columns.length < 4) continue;

                    const vehicleName = columns[1];
                    const priority = parseInt(columns[2]) || 0;
                    const rawImages = columns[3];

                    const driveIds = [];
                    const driveIdRegex = /\/d\/([a-zA-Z0-9_-]+)/g;
                    let match;
                    while ((match = driveIdRegex.exec(rawImages)) !== null) {
                        driveIds.push(match[1]);
                    }

                    if (vehicleName && driveIds.length > 0) {
                        projects.push({ name: vehicleName, priority, ids: driveIds });
                    }
                }

                // 2. Sort by Priority (Ascending: 1, 2, 3...)
                projects.sort((a, b) => a.priority - b.priority);

                // 3. Cache the new data
                localStorage.setItem('motofix_gallery_cache', JSON.stringify(projects));

                // 4. Render to UI
                renderHTML(projects);

            } catch (error) {
                console.error('Fetch Error:', error);
                if (!cachedData) {
                    container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--red);">Connection error. Please try again.</p>';
                }
            }
        }

        function renderHTML(projects) {
            const container = document.getElementById('galleryContainer');
            let html = '';

            projects.forEach(project => {
                const coverImg = `https://lh3.googleusercontent.com/d/${project.ids[0]}`;
                const allImgsJson = JSON.stringify(project.ids).replace(/'/g, "&apos;");
                
                html += `
                    <div class="project-card" onclick='openLightbox("${project.name}", ${allImgsJson})'>
                        <div class="project-card-image">
                            <img src="${coverImg}" alt="${project.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400/111/fff?text=Photo+Private'">
                        </div>
                        <div class="project-card-info">
                            <h3>${project.name}</h3>
                            <span class="project-card-count">${project.ids.length} Photos</span>
                        </div>
                    </div>
                `;
            });

            if (html) {
                container.innerHTML = html;
            } else if (!projects.length) {
                container.innerHTML = '<div style="text-align:center; padding:50px; grid-column:1/-1; color:var(--mid);">No records found. High quality projects coming soon!</div>';
            }
        }

        function openLightbox(name, ids) {
            currentProjectImages = ids;
            currentIndex = 0;
            document.getElementById('lightboxCaption').textContent = name;
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightboxImage() {
            const id = currentProjectImages[currentIndex];
            document.getElementById('lightboxImg').src = `https://lh3.googleusercontent.com/d/${id}`;
        }

        function changeImage(dir) {
            currentIndex += dir;
            if (currentIndex < 0) currentIndex = currentProjectImages.length - 1;
            if (currentIndex >= currentProjectImages.length) currentIndex = 0;
            updateLightboxImage();
        }

        // Close on overlay click
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Key navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
        });

        fetchGallery();
    </script>
</body>
</html>
</body>
</html>
